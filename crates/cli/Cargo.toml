[package]
name = "upone"
version = "0.5.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/CarlosEduJs/upone"

[[bin]]
name = "upone"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
upone-core.workspace = true
upone-providers.workspace = true
clap.workspace = true
anyhow.workspace = true
ratatui.workspace = true
crossterm.workspace = true

# dist ships the upone binary; publish stays off (no crates.io).
[package.metadata.dist]
dist = true
