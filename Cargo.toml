[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
upone-core = { path = "crates/core" }
upone-providers = { path = "crates/providers" }

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "io-util", "time"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
dirs = "6"
