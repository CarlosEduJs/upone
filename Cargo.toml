[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers",
    "crates/cli",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/CarlosEduJs/upone"

[workspace.dependencies]
upone-core = { path = "crates/core" }
upone-providers = { path = "crates/providers" }

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "io-util", "time"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
dirs = "6"
semver = "1"
serde_json = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
