name: ci

# Validation gate for the main branch and pull requests: formatting, lint,
# unit tests and the example fixtures (dry-run on every change; full
# execution when the providers/examples surface is touched).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  # Fast smoke: assert the detected plan for every example fixture. No
  # network, no docker — the dry-run path only reads files and builds the bin.
  examples-dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify example plans
        run: ./scripts/verify-examples.sh

  # Full integration: actually runs the plans (installs deps, starts docker
  # services, generates). Runs on main and, on PRs, only when the surface
  # under test changed. Docker examples skip themselves when docker is down.
  examples-exec:
    runs-on: ubuntu-latest
    needs: examples-dry
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'crates/**'
              - 'examples/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Install bun
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        run: npm install -g pnpm

      - name: Install yarn (corepack)
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        run: npm install -g corepack && corepack enable

      - name: Install Go
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Python
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        uses: astral-sh/setup-uv@v6

      - name: Install poetry
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        run: pip install poetry

      - name: Install Ruby
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install PHP + Composer
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}

      - name: Wait for postgres
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        run: until (echo > /dev/tcp/localhost/5432) 2>/dev/null; do sleep 1; done

      - name: Run examples
        if: ${{ github.event_name == 'push' || steps.filter.outputs.relevant == 'true' }}
        run: ./scripts/verify-examples.sh --exec
