name: orm-typeorm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upone
      POSTGRES_PASSWORD: upone
      POSTGRES_DB: upone
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: